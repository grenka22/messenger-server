<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFE4D1">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Кто вы?</h1>
      <p>Выберите себя</p>
      <button class="user-btn" data-user="Тимофей"><div class="user-avatar">Т</div><span>Тимофей</span></button>
      <button class="user-btn" data-user="Катюшка"><div class="user-avatar">К</div><span>Катюшка</span></button>
    </div>
  </div>

  <div class="header">
    <div class="peer-avatar-wrap">
      <div class="peer-avatar" id="peerAvatar">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="#C9B0A0"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
      </div>
      <button class="peer-status-icon" id="peerStatusIcon" hidden></button>
    </div>
    <div class="peer-info">
      <div class="peer-name" id="peerName">…</div>
      <div class="peer-status" id="peerStatus">не в сети</div>
    </div>
    <button class="profile-btn" id="btnProfile">
      <img id="headerAvatar" src="" alt="">
      <svg id="headerAvatarPlaceholder" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
    </button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <button class="icon-only" id="btnAttach" title="Прикрепить">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V6a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v10.5a2.5 2.5 0 0 0 5 0V6a4 4 0 0 0-8 0v11.5a5.5 5.5 0 0 0 11 0V6h-1.5Z"/></svg>
    </button>
    <button class="icon-only" id="btnEmoji" title="Эмодзи">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16ZM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm-7.36 3.5a1 1 0 1 0-1.28 1.54A6.98 6.98 0 0 0 12 18a6.98 6.98 0 0 0 5.14-1.96 1 1 0 1 0-1.28-1.54A4.99 4.99 0 0 1 12 16a4.99 4.99 0 0 1-3.86-1.5Z"/></svg>
    </button>
    <input type="text" id="textInput" placeholder="Сообщение…" autocomplete="off">
    <button class="icon-only" id="btnCircle" title="Кружок"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M17 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4Z"/></svg></button>
    <button id="btnVoice" title="Голосовое"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
    <button id="btnSend" title="Отправить"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>

  <input type="file" id="fileInput" hidden multiple>

  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header"><h2>Профиль</h2><button class="close-btn" id="closeProfile">✕</button></div>
      <div class="avatar-section">
        <div class="avatar-preview">
          <img id="avatarImg" src="" alt="">
          <svg id="avatarPlaceholder" viewBox="0 0 24 24" width="60" height="60" fill="#C9B0A0"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
          <label for="avatarInput" class="avatar-edit"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg></label>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
      </div>
      <div class="field"><label>Имя</label><input type="text" id="profileName" maxlength="40"></div>
      <div class="field"><label>Почта</label><input type="email" id="profileEmail" maxlength="80"></div>
      <button class="save-btn" id="saveProfile">Сохранить</button>
      <button class="save-btn" id="openStatusFromProfile" style="background:#E24A4A; margin-top:8px;">Установить статус</button>
    </div>
  </div>

  <div class="modal" id="statusModal">
    <div class="modal-content">
      <div class="modal-header"><h2>Статус</h2><button class="close-btn" id="closeStatus">✕</button></div>
      <p class="modal-hint">Выберите, что чувствуете</p>
      <div class="status-grid">
        <button class="status-item" data-emoji="❤️" data-text="Я тебя очень сильно люблю"><div class="status-emoji">❤️</div><div class="status-text">Я тебя очень сильно люблю</div></button>
        <button class="status-item" data-emoji="💔" data-text="Очень по тебе скучаю"><div class="status-emoji">💔</div><div class="status-text">Очень по тебе скучаю</div></button>
        <button class="status-item" data-emoji="😢" data-text="Мне плохо"><div class="status-emoji">😢</div><div class="status-text">Мне плохо</div></button>
      </div>
      <div id="recentStatusesBlock" style="display:none;">
        <p class="modal-hint" style="margin-top:16px;">Недавние</p>
        <div class="recent-statuses" id="recentStatuses"></div>
      </div>
      <button class="save-btn" id="clearStatus" style="background:#aaa; margin-top:12px;">Убрать статус</button>
    </div>
  </div>

  <div class="modal" id="emojiModal">
    <div class="modal-content">
      <div class="modal-header"><h2>Эмодзи со смыслом</h2><button class="close-btn" id="closeEmoji">✕</button></div>
      <p class="modal-hint">Выберите эмодзи и напишите, что он значит</p>
      <div class="emoji-picker">
        <div class="emoji-picker-current" id="emojiCurrent">🙂</div>
        <div class="emoji-scroll" id="emojiScroll"></div>
      </div>
      <div class="field"><label>Описание</label><input type="text" id="emojiDesc" placeholder="Например: я тебя обнимаю" maxlength="60"></div>
      <button class="save-btn" id="saveEmoji">Поставить</button>
    </div>
  </div>

  <div class="status-tooltip" id="statusTooltip"></div>

  <div class="circle-preview" id="circlePreview">
    <video id="circleVideo" autoplay muted playsinline></video>
    <div class="timer" id="circleTimer">0:00 / 1:00</div>
    <div class="controls">
      <button class="cancel" id="circleCancel">✕</button>
      <button class="send" id="circleSend">➤</button>
    </div>
  </div>

  <div class="rec-indicator" id="recIndicator">
    <div class="dot"></div><span id="recTime">0:00</span><span class="hint">отпустите для отправки</span>
  </div>

  <script src="app.js?v=8"></script>
</body>
</html>
