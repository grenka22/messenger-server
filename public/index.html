<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFE4D1">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран выбора пользователя (показывается один раз) -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Кто вы?</h1>
      <p>Выберите себя, чтобы начать общение</p>
      <button class="user-btn" data-user="Тимофей">
        <div class="user-avatar">Т</div>
        <span>Тимофей</span>
      </button>
      <button class="user-btn" data-user="Катюшка">
        <div class="user-avatar">К</div>
        <span>Катюшка</span>
      </button>
    </div>
  </div>

  <!-- Шапка с собеседником -->
  <div class="header">
    <div class="peer-avatar" id="peerAvatar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#C9B0A0">
        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
      </svg>
    </div>
    <div class="peer-info">
      <div class="peer-name" id="peerName">Собеседник</div>
      <div class="peer-status" id="peerStatus">офлайн</div>
    </div>
    <button class="profile-btn" id="btnProfile" title="Профиль">
      <img id="headerAvatar" src="" alt="">
      <svg id="headerAvatarPlaceholder" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
      </svg>
    </button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <button class="icon-only" id="btnCircle" title="Кружок">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
        <path d="M17 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4Z"/>
      </svg>
    </button>
    <input type="text" id="textInput" placeholder="Сообщение…" autocomplete="off">
    <button id="btnVoice" title="Голосовое">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
      </svg>
    </button>
    <button id="btnSend" title="Отправить">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <!-- Модальное окно профиля -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Профиль</h2>
        <button class="close-btn" id="closeProfile">✕</button>
      </div>

      <div class="avatar-section">
        <div class="avatar-preview">
          <img id="avatarImg" src="" alt="">
          <svg id="avatarPlaceholder" viewBox="0 0 24 24" width="60" height="60" fill="#C9B0A0">
            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
          </svg>
          <label for="avatarInput" class="avatar-edit">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/>
            </svg>
          </label>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
      </div>

      <div class="field">
        <label>Имя</label>
        <input type="text" id="profileName" placeholder="Ваше имя" maxlength="40">
      </div>

      <div class="field">
        <label>Почта</label>
        <input type="email" id="profileEmail" placeholder="you@example.com" maxlength="80">
      </div>

      <button class="save-btn" id="saveProfile">Сохранить</button>
    </div>
  </div>

  <div class="circle-preview" id="circlePreview">
    <video id="circleVideo" autoplay muted playsinline></video>
    <div class="timer" id="circleTimer">0:00 / 1:00</div>
    <div class="controls">
      <button class="cancel" id="circleCancel">✕</button>
      <button class="send" id="circleSend">➤</button>
    </div>
  </div>

  <div class="rec-indicator" id="recIndicator">
    <div class="dot"></div>
    <span id="recTime">0:00</span>
    <span class="hint">отпустите для отправки</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
